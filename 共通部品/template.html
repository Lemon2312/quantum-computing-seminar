<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<style>
@@CSS@@
</style>
</head>
<body>
<div id="ovHead"><b>スライド一覧</b><span>クリックでそのスライドへ ／ ← → で選択、Enter で開く、O / Esc で戻る</span><button id="btnOvClose">一覧を閉じる</button></div>
<div id="viewport"><div id="stage">

@@SLIDES@@
</div></div>
<div id="ui">
  <button id="btnPrev">◀</button><span id="counter"></span><button id="btnNext">▶</button>
  <button id="btnFs">全画面 (F)</button>
  <button id="btnOv">一覧 (O)</button>
  <span>← → / Space でページ送り</span>
</div>
<div id="progress"></div>
<div id="penbar" aria-label="ペンの道具">
  <button data-tool="none" class="on" title="普通のカーソル（文字の選択・コピーができる）">🖱️ カーソル</button>
  <button data-tool="laser" title="レーザーポインター（書き込みは残らない）">🔴 レーザー</button>
  <button data-tool="pen" title="黒ペンで書き込む (P)">✏️ 黒ペン</button>
  <button data-tool="eraser" title="消しゴム（なぞった線を消す）">🧽 消す</button>
  <button data-tool="lasso" title="投げ縄：書き込みを囲んで選択・移動・複製 (L)">➰ 投げ縄</button>
  <button id="inkPaste" title="コピーした書き込みを貼り付け (V)" disabled>📌 貼り付け</button>
  <span class="sep"></span>
  <button id="inkUndo" title="元に戻す (Z)">↩️</button>
  <button id="inkClear" title="このスライドの書き込みを全部消す">🗑️</button>
</div>
<script>
@@JS@@
</script>
</body>
</html>
